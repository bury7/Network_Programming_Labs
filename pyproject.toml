[project]
authors     = [{name = "Artem Nizhyvenko", email = "artem_nizhyvenko@proton.me"}]
description = "University network programming labs"
name        = "Network_Programming_Labs"
readme      = "README.md"
version     = "0.1.0"

dependencies    = [
  "click>=8.5.1",
  "flask>=3.1.3",
  "matplotlib>=3.11.2",
  "python-dotenv>=1.2.4",
  "python-telegram-bot>=22.8",
  "requests>=2.34.2",
  "telethon>=1.46.0",
]
requires-python = ">=3.15"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
  "ty>=0.0.110",
]

[project.urls]
repository = "https://github.com/bury7/Network_Programming_Labs"

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
exclude = [
  "*.ipynb",
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".github",
  ".hg",
  ".idea",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pycache__",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "env_files",
  "node_modules",
  "site-packages",
  "tmp",
  "venv",
]

indent-width = 4
line-length  = 119

target-version = "py315"

[tool.ruff.lint]
ignore = ["C901", "COM812", "CPY", "D", "DOC", "PLR0912", "PLR0915", "T201"]
select = ["ALL"]

fixable   = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format     = false
indent-style              = "space"
line-ending               = "auto"
quote-style               = "double"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.15"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
addopts   = ["--strict-markers"]
testpaths = ["pz_1"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
fail_under   = 85
show_missing = true
